<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taste vault — design test</title>
<!--
  DESIGN TEST ROUTE. Isolated from production: vault/index.html is untouched.
  Reads the same ../sites.json and ../vocab.json — no data is forked, nothing is
  written back. Review controls mutate a local working copy and export the file,
  which is the offline path production already documents; the token path is
  deliberately NOT duplicated here (a test route should not handle credentials).

  Design Read: PURE auction-editorial. Applying vault/EVIDENCE.md A1 (one governing
  event owns the first screen), A2 (identity carried by one system, not an
  accumulation of devices), A3 (interface subordinate to the work, floored by the
  entries' own recorded weaknesses about micro-type). D1 says nothing is known about
  colour preference from the evidence, so the palette is CARRIED from production
  rather than invented.
-->
<style>
:root {
  /* Carried from production. Not a colour decision — see D1. */
  --bg: #0b0b0c;
  --bg-raised: #141416;
  --ink: #f2f1ee;
  --ink-70: rgba(242,241,238,.7);
  --ink-50: rgba(242,241,238,.52);
  --rule: rgba(242,241,238,.14);
  --rule-strong: rgba(242,241,238,.28);
  --accent: #d98b3e;
  --danger: #e0655a;

  /* A3's floor: nothing functional below 14px. */
  --text-floor: .875rem;
  --text-body: 1rem;
  --text-lead: clamp(1.0625rem, .5vw + .95rem, 1.25rem);
  /* Scale contrast is the dialect's instrument — the steps are wide on purpose. */
  --text-h3: clamp(1.375rem, 1.2vw + 1rem, 1.75rem);
  --text-h2: clamp(1.75rem, 2.4vw + 1.1rem, 2.75rem);
  --text-display: clamp(2.75rem, 8.5vw + .5rem, 8.5rem);

  --space-1: .25rem; --space-2: .5rem;  --space-3: .75rem; --space-4: 1rem;
  --space-5: 1.5rem; --space-6: 2.5rem; --space-7: 4rem;   --space-8: 7rem;

  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  --track-label: .12em;
  --dur: 260ms;
  --ease: cubic-bezier(.2,.6,.2,1);
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-text); font-size: var(--text-body); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; }

.label {
  font-family: var(--font-mono); font-size: var(--text-floor);
  letter-spacing: var(--track-label); text-transform: uppercase; line-height: 1.3;
}
.wrap { max-width: 96rem; margin: 0 auto; padding-inline: clamp(1rem, 3.5vw, 3.5rem); }

/* ── register: the interface, held to one thin band (A3) ─────────────────── */
.register {
  position: sticky; top: 0; z-index: 40; background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.register-in {
  display: flex; align-items: center; gap: var(--space-5);
  padding-block: var(--space-3); flex-wrap: wrap;
}
.mark { font-weight: 700; letter-spacing: -.01em; }
.mark b { color: var(--accent); }
.register .count { color: var(--ink-50); margin-inline-start: auto; }
.register-actions { display: flex; gap: var(--space-4); align-items: center; }
.btn {
  background: none; border: 1px solid var(--rule-strong); color: var(--ink);
  padding: var(--space-2) var(--space-4); cursor: pointer;
  min-height: 44px;                       /* review controls stay operable */
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.btn:hover { border-color: var(--ink); }
.btn--quiet { border: 0; padding-inline: 0; color: var(--ink-50); }
.btn--quiet:hover { color: var(--ink); }
:where(a, button, input, select, [tabindex]):focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}

/* ── the governing event: one plate, full bleed (A1) ─────────────────────── */
/* MEASURED, then changed: the first build put the copy over the shot behind a
   scrim, and beings-co's hero is a white page — the title collided with the
   reference's own wordmark and the right half blew out. A hero shot's tone is not
   knowable per entry, so the composition may not depend on it (C17). The plate is
   now a composed pair: copy on the page's own ground, image bleeding right, no
   text over image anywhere. Asymmetric, and robust to any luminance. */
.plate { border-bottom: 1px solid var(--rule); }
.plate-in {
  display: grid; grid-template-columns: 7fr 5fr; align-items: stretch; min-height: min(62vh, 38rem);
}
.plate-img { position: relative; overflow: hidden; background: var(--bg-raised); border-left: 1px solid var(--rule); }
.plate-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.plate-copy {
  display: grid; align-content: end; gap: 0;
  padding: clamp(1.5rem, 4vw, var(--space-7));
}
.plate-eyebrow { color: var(--accent); margin-bottom: var(--space-4); display: flex; gap: var(--space-4); flex-wrap: wrap; }
.plate-title {
  font-size: var(--text-display); line-height: .92; letter-spacing: -.03em;
  margin: 0 0 var(--space-4); font-weight: 700; text-wrap: balance;
}
.plate-note { font-size: var(--text-lead); color: var(--ink-70); margin: 0 0 var(--space-5); max-width: 44ch; }
.plate-meta { display: flex; gap: var(--space-5); flex-wrap: wrap; color: var(--ink-50); }

/* ── filters: a quiet strip, not a panel ─────────────────────────────────── */
.strip {
  border-bottom: 1px solid var(--rule); border-top: 1px solid var(--rule);
  background: var(--bg-raised); padding-block: var(--space-4);
  position: sticky; top: 3.5rem; z-index: 30;
}
.strip-row { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }
.strip .search {
  flex: 0 0 auto; min-width: 14rem; background: none; border: 0;
  border-bottom: 1px solid var(--rule); color: var(--ink);
  padding: var(--space-2) 0; font: inherit; min-height: 44px;
}
.strip .search:focus { outline: none; border-bottom-color: var(--ink); }
.strip .search::placeholder { color: var(--ink-50); }
.strip-note { color: var(--ink-50); margin-inline-start: auto; }
.chip {
  background: none; border: 1px solid var(--rule); color: var(--ink-70);
  padding: var(--space-2) var(--space-3); cursor: pointer; min-height: 44px;
  font-family: var(--font-mono); font-size: var(--text-floor);
  letter-spacing: var(--track-label); text-transform: uppercase;
}
.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.chip-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ── the index: records, not cards (rhythm, not a grid) ──────────────────── */
.index { border-bottom: 1px solid var(--rule); padding-block: var(--space-4) var(--space-6); }
.rec {
  display: grid; grid-template-columns: 3.5rem minmax(0,1fr) 20rem 8rem;
  gap: var(--space-6); align-items: start;
  padding-block: var(--space-6);
  border-bottom: 1px solid var(--rule);
  cursor: pointer; text-align: left; width: 100%;
  background: none; border-inline: 0; border-top: 0;
  transition: background var(--dur) var(--ease);
}
.rec:hover, .rec:focus-visible { background: var(--bg-raised); }
.rec-n { color: var(--ink-50); padding-top: .35rem; }
.rec-title { font-size: var(--text-h2); line-height: 1.04; letter-spacing: -.02em; margin: 0 0 var(--space-3); font-weight: 600; }
.rec-note { color: var(--ink-70); margin: 0; font-size: var(--text-lead); max-width: 58ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rec-thumb { aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg-raised); }
.rec-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.rec-meta { display: grid; gap: var(--space-2); justify-items: end; text-align: right; color: var(--ink-50); }
/* The orange was reading as an alert on every second row. IN is a quiet positive
   classification: ink at full strength with a small filled dot. The accent stays
   for the wordmark, the hero eyebrow and focus. */
.mark-status { color: var(--ink-50); display: inline-flex; align-items: center; gap: .45em; }
.mark-status::before {
  content: ""; inline-size: .4em; block-size: .4em; border-radius: 50%;
  background: currentColor; opacity: .55;
}
.mark-status[data-s="in"] { color: var(--ink); }
.mark-status[data-s="in"]::before { opacity: 1; }
.mark-status[data-s="out"] { color: var(--ink-50); }
.mark-status[data-s="out"]::before { background: none; box-shadow: inset 0 0 0 1px currentColor; opacity: .8; }


.end { padding-block: var(--space-7) var(--space-8); color: var(--ink-50); }

/* ── detail: an overlay, the gallery position preserved behind ────────────── */
dialog.detail {
  border: 0; padding: 0; max-width: min(78rem, 96vw); width: 100%;
  max-height: 92vh; background: var(--bg); color: var(--ink);
  border: 1px solid var(--rule);
}
dialog.detail::backdrop { background: rgba(6,6,7,.86); }
.detail-bar {
  position: sticky; top: 0; background: var(--bg); z-index: 2;
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--rule);
}
.detail-bar .label { color: var(--ink-50); }
.detail-body { padding: 0 var(--space-5) var(--space-6); overflow-y: auto; max-height: calc(92vh - 4rem); }
.detail-hero { margin-inline: calc(var(--space-5) * -1); border-bottom: 1px solid var(--rule); }
.detail-hero img { width: 100%; }
/* The judgement owns the first viewport. The screenshot is evidence, so it sits
   in the subordinate column at its natural aspect ratio and never sets the modal
   height. Four blocks, explicit order: judgement · preview · filmstrip · apparatus.
   Desktop puts preview and apparatus in the right column; mobile falls to one
   column in exactly that order. */
.detail-grid {
  display: grid; grid-template-columns: minmax(0,1fr) 19rem;
  grid-template-areas: 'judgement preview' 'film apparatus';
  gap: var(--space-5) var(--space-6); padding-top: var(--space-5); align-items: start;
}
/* The filmstrip is a column-flow grid, so without this its min-content width sets
   the whole track and the modal overflows the phone. Same fix production carries
   on .detail > *. */
.detail-grid > * { min-width: 0; }
.d-judgement { grid-area: judgement; }
.d-preview { grid-area: preview; }
.d-film { grid-area: film; }
.d-apparatus { grid-area: apparatus; }
.d-title { font-size: var(--text-h2); line-height: 1.02; letter-spacing: -.025em; margin: 0 0 var(--space-2); font-weight: 700; }
.d-sub { color: var(--ink-50); margin: 0 0 var(--space-5); display: flex; gap: var(--space-4); flex-wrap: wrap; }
.d-preview a { display: block; border: 1px solid var(--rule); }
.d-preview img { width: 100%; height: auto; max-height: 34vh; object-fit: cover; object-position: top center; }
.d-preview figcaption { color: var(--ink-50); margin-top: var(--space-2); }
.judgement { border-top: 1px solid var(--rule); padding-top: var(--space-4); margin-top: var(--space-5); }
.judgement:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.judgement h4 { margin: 0 0 var(--space-2); }
.judgement p { margin: 0; color: var(--ink-70); white-space: pre-wrap; }
/* MEASURED: with a long evidence note the judgement column ran 2,400px,
   so "what works" and "weaknesses" began far below the fold and the reader could
   not see that a verdict had three parts. Each block opens clamped; the headings
   stay above the fold, and the full text is one quiet control away. */
.judgement p.clamp { display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
.judgement .more { margin-top: var(--space-2); }
.plate-dl { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-4); margin: 0; }
.plate-dl dt { color: var(--ink-50); }
.plate-dl dd { margin: 0; }
.film { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(9rem, 12rem);
  gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-3); scroll-snap-type: x proximity; }
.film figure { margin: 0; scroll-snap-align: start; }
.film img { aspect-ratio: 16/10; object-fit: cover; object-position: top center; background: var(--bg-raised); }
.film figcaption { color: var(--ink-50); margin-top: var(--space-1); }
.review { display: grid; gap: var(--space-4); }
.review select, .review input[type="number"] {
  background: var(--bg-raised); color: var(--ink); border: 1px solid var(--rule);
  padding: var(--space-2) var(--space-3); min-height: 44px; font: inherit; width: 100%;
}
.tagset { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.tag { border: 1px solid var(--rule); padding: var(--space-1) var(--space-3); color: var(--ink-70);
  font-family: var(--font-mono); font-size: var(--text-floor); letter-spacing: var(--track-label); text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ── mobile: authored, not stacked ───────────────────────────────────────── */
@media (max-width: 60rem) {
  .rec { grid-template-columns: 2.5rem 1fr; gap: var(--space-4); }
  .rec-thumb { grid-column: 2; order: 3; }
  .rec-meta { grid-column: 2; justify-items: start; text-align: left; order: 4;
    display: flex; gap: var(--space-4); flex-wrap: wrap; }
  .detail-grid { grid-template-columns: 1fr; grid-template-areas: 'judgement' 'preview' 'film' 'apparatus'; }
  .d-preview img { max-height: none; }
}
@media (max-width: 40rem) {
  /* The plate keeps the dominant, at a proportion a phone can hold. */
  .plate-in { grid-template-columns: 1fr; min-height: 0; }
  .plate-img { aspect-ratio: 4 / 3; order: -1; border-left: 0; border-bottom: 1px solid var(--rule); }
  .plate-copy { max-width: none; }
  .plate-note { font-size: var(--text-body); }
  /* MEASURED: the register wrapped to four lines and took 640px before any
     reference appeared — the interface out-massing the work, which is the A3
     failure this design is built to avoid. One row on a phone: mark, count, and
     the way out. The provenance label is desktop-only; it is not information a
     phone visitor needs. */
  .register-in { flex-wrap: nowrap; gap: var(--space-3); align-items: baseline; }
  .register-in > .label:not(.count) { display: none; }
  /* The floor holds: 14px, and the row fits by cutting tracking, not size (I7). */
  .register .count { margin-inline-start: auto; letter-spacing: .04em; }
  .register-actions .btn { letter-spacing: .04em; }
  .mark { font-size: 1rem; white-space: nowrap; }
  .strip-row { gap: var(--space-3); }
  .strip .search { min-width: 100%; }
  .detail-body { padding-inline: var(--space-4); }
  .detail-hero { margin-inline: calc(var(--space-4) * -1); }
}
</style>
</head>
<body>

<header class="register">
  <div class="wrap register-in">
    <span class="mark"><b>360°</b> Taste vault</span>
    <span class="label" style="color:var(--ink-50)">design test · read from ../sites.json</span>
    <span class="label count" id="count">reading…</span>
    <span class="register-actions">
      <a class="btn btn--quiet label" href="../index.html">production vault →</a>
    </span>
  </div>
</header>

<main id="main">
  <section class="plate" id="plate" aria-label="The collection's governing reference"></section>

  <section class="strip">
    <div class="wrap strip-row">
      <input class="search" id="search" type="search" placeholder="search titles, notes, tags" aria-label="Search the vault">
      <span class="chip-row" id="status-filters"></span>
      <span class="chip-row" id="rating-filters"></span>
      <button class="btn btn--quiet label" id="clear" hidden>clear</button>
      <span class="label strip-note" id="strip-note"></span>
    </div>
  </section>

  <section class="index wrap" id="index" aria-label="The collection"></section>
  <p class="wrap end label" id="end"></p>
</main>

<dialog class="detail" id="detail" aria-label="Entry detail">
  <div class="detail-bar">
    <span class="label" id="detail-id"></span>
    <button class="btn btn--quiet label" style="margin-inline-start:auto" id="detail-close">close ✕</button>
  </div>
  <div class="detail-body" id="detail-body"></div>
</dialog>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const el = (t, p = {}, ...k) => { const { dataset, ...rest } = p; const n = Object.assign(document.createElement(t), rest);
  if (dataset) Object.assign(n.dataset, dataset); k.flat().forEach(c => c != null && n.append(c)); return n; };
/* Shot paths are stored relative to vault/, and this route lives one level deeper. */
const src = (p) => p ? `../${p}` : null;
const blank = (t) => !t || !String(t).trim() || String(t).trim().toUpperCase() === 'TODO';
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u || ''; } };

let entries = [], vocab = { categories: {}, dialects: [], dialectStatus: [] };
const filters = { status: new Set(), rating: new Set(), q: '' };

const boot = async () => {
  const [s, v] = await Promise.all([
    fetch('../sites.json').then(r => r.json()),
    fetch('../vocab.json').then(r => r.json()),
  ]);
  vocab = v;
  entries = s.map(e => ({ ...e, tags: e.tags ?? {}, dialects: e.dialects ?? [], extras: e.extras ?? [] }));
  renderFilters(); renderPlate(); render();
};

/* A1 — one governing event. The plate is the strongest reviewed entry: highest
   rating, human-set `in`, most recently added. Not a random hero. */
function governing() {
  const scored = entries
    .filter(e => e.dialectStatus === 'in' && e.shots?.hero && !blank(e.note))
    .sort((a, b) => (b.rating - a.rating) || String(b.added).localeCompare(String(a.added)));
  return scored[0] ?? entries.find(e => e.shots?.hero);
}

function renderPlate() {
  const e = governing(); if (!e) return;
  const img = el('div', { className: 'plate-img' }, el('img', { src: src(e.shots.hero), alt: `${e.title} — first screen` }));
  const copy = el('div', { className: 'plate-copy' },
    el('div', { className: 'plate-eyebrow label' },
      el('span', { textContent: 'the reference' }),
      el('span', { textContent: `rating ${e.rating} of 3` }),
      el('span', { textContent: e.dialectStatus })),
    el('h1', { className: 'plate-title', textContent: e.title || host(e.url) }),
    el('p', { className: 'plate-note', textContent: (e.note || '').replace(/^(IN|OUT|MAYBE)\s*—\s*/, '').slice(0, 260) }),
    el('div', { className: 'plate-meta label' },
      el('span', { textContent: e.added }),
      el('span', { textContent: (e.dialects || []).join(', ') || 'no dialect' }),
      el('button', { className: 'btn btn--quiet label', textContent: 'read the judgement →',
        onclick: () => openDetail(e.id) })));
  $('#plate').replaceChildren(el('div', { className: 'plate-in' }, copy, img));
}

function renderFilters() {
  const statuses = vocab.dialectStatus?.length ? vocab.dialectStatus : ['unreviewed', 'in', 'out', 'hybrid'];
  $('#status-filters').replaceChildren(...statuses.map(st => {
    const b = el('button', { className: 'chip', type: 'button', textContent: st });
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { filters.status.has(st) ? filters.status.delete(st) : filters.status.add(st);
      b.setAttribute('aria-pressed', String(filters.status.has(st))); render(); };
    return b;
  }));
  $('#rating-filters').replaceChildren(...[3, 2, 1].map(r => {
    const b = el('button', { className: 'chip', type: 'button', textContent: `★ ${r}` });
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { filters.rating.has(r) ? filters.rating.delete(r) : filters.rating.add(r);
      b.setAttribute('aria-pressed', String(filters.rating.has(r))); render(); };
    return b;
  }));
  $('#search').oninput = (ev) => { filters.q = ev.target.value.toLowerCase(); render(); };
  $('#clear').onclick = () => { filters.status.clear(); filters.rating.clear(); filters.q = '';
    $('#search').value = ''; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false')); render(); };
}

const matches = (e) => {
  if (filters.status.size && !filters.status.has(e.dialectStatus)) return false;
  if (filters.rating.size && !filters.rating.has(e.rating)) return false;
  if (!filters.q) return true;
  const hay = [e.title, e.note, e.works, e.weaknesses, e.id, ...Object.values(e.tags).flat()].join(' ').toLowerCase();
  return hay.includes(filters.q);
};

/* Rhythm, not a grid: records in sequence, interrupted by a wide plate for a
   rating-3 every fifth position. The interruption is the pace (C7). */
function render() {
  const list = entries.filter(matches).sort((a, b) => String(b.added).localeCompare(String(a.added)));
  $('#index').replaceChildren(...list.map((e, i) => record(e, i + 1)));
  const anyFilter = filters.status.size || filters.rating.size || filters.q;
  $('#clear').hidden = !anyFilter;
  $('#count').textContent = `${list.length} of ${entries.length} references`;
  /* Status line, from the filtered result. Entries, in and out are always shown;
     anything that counts zero is left out rather than printed as "0". */
  const seen = (st) => list.filter((e) => e.dialectStatus === st).length;
  const debt = list.filter((e) => blank(e.note) && blank(e.works) && blank(e.weaknesses)).length;
  const pending = seen("unreviewed");
  $("#strip-note").textContent = [
    list.length + (list.length === 1 ? " entry" : " entries"),
    seen("in") + " in",
    seen("out") + " out",
    pending ? pending + " awaiting judgement" : null,
    debt ? debt + " without a note" : null,
  ].filter(Boolean).join(" · ");
  $('#end').textContent = list.length
    ? `end of the collection · ${entries.filter(e => e.dialectStatus === 'in').length} in · ${entries.filter(e => e.dialectStatus === 'out').length} out · ${debt} without a judgement`
    : 'nothing matches those filters.';
}

function record(e, n) {
  const b = el('button', { className: 'rec', type: 'button' });
  b.dataset.id = e.id;
  b.append(
    el('span', { className: 'rec-n label', textContent: String(n).padStart(2, '0') }),
    el('span', {},
      el('h2', { className: 'rec-title', textContent: e.title || host(e.url) }),
      el('p', { className: 'rec-note', textContent: blank(e.note) ? 'no judgement written yet' : e.note.replace(/^(IN|OUT|MAYBE)\s*—\s*/, '') })),
    e.shots?.hero ? el('span', { className: 'rec-thumb' }, el('img', { src: src(e.shots.hero), alt: '', loading: 'lazy' }))
                  : el('span', { className: 'rec-thumb' }),
    el('span', { className: 'rec-meta label' },
      el('span', { className: 'mark-status', dataset: { s: e.dialectStatus }, textContent: e.dialectStatus }),
      el('span', { textContent: `★ ${e.rating}` }),
      el('span', { textContent: e.added })));
  b.onclick = () => openDetail(e.id);
  return b;
}

/* ── detail: every field production carries, in reading order ─────────────── */
function openDetail(id) {
  const e = entries.find(x => x.id === id); if (!e) return;
  $('#detail-id').textContent = e.id;
  const body = $('#detail-body');
  /* The note is the payload; the shot is evidence for it. The record opens with
     the judgement, and the screenshot waits in the subordinate column. */
  const left = el('div', { className: 'd-judgement' });
  left.append(el('h2', { className: 'd-title', textContent: e.title || host(e.url) }));
  left.append(el('p', { className: 'd-sub label' },
    el('span', { textContent: `rating ${e.rating} of 3` }),
    el('span', { className: 'mark-status', dataset: { s: e.dialectStatus }, textContent: e.dialectStatus }),
    el('span', { textContent: e.added ?? '' }),
    (e.dialects || []).length ? el('span', { textContent: e.dialects.join(', ') }) : null));
  if (e.captureError) left.append(el('p', { className: 'label', style: 'color:var(--danger)', textContent: e.captureError }));

  for (const [k, title] of [['note', 'the note — the payload'], ['works', 'what works'], ['weaknesses', 'weaknesses']]) {
    if (blank(e[k])) continue;
    const body = el('p', { className: 'clamp', textContent: e[k] });
    const block = el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: title }), body);
    left.append(block);
    /* Only when it actually overflows — a control that does nothing is a device
       with no job (TASTE.md §2c device budget). */
    requestAnimationFrame(() => {
      if (body.scrollHeight <= body.clientHeight + 2) return;
      const more = el('button', { className: 'btn btn--quiet label more', type: 'button', textContent: 'read all →' });
      more.setAttribute('aria-expanded', 'false');
      more.onclick = () => {
        const open = body.classList.toggle('clamp');
        more.textContent = open ? 'read all →' : 'show less ←';
        more.setAttribute('aria-expanded', String(!open));
      };
      block.append(more);
    });
  }
  const film = el('div', { className: 'd-film' });
  const strip = (e.shots?.strip ?? []).filter(Boolean);
  if (strip.length) {
    film.append(el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: `scroll · ${strip.length} frames` }),
      el('div', { className: 'film' }, ...strip.map((p, i) =>
        el('figure', {}, el('a', { href: src(p), target: '_blank', rel: 'noreferrer noopener' },
          el('img', { src: src(p), alt: `frame ${i + 1}`, loading: 'lazy' })),
          el('figcaption', { className: 'label', textContent: String(i + 1) }))))));
  }
  if (e.shots?.navScrolled) {
    film.append(el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: 'header after the first screen' }),
      el('img', { src: src(e.shots.navScrolled), alt: 'scrolled header', style: 'max-width:28rem' })));
  }
  if (e.extras?.length) {
    film.append(el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: `extra photos · ${e.extras.length}` }),
      el('div', { className: 'film' }, ...e.extras.filter(x => x.file).map(x =>
        el('figure', {}, el('img', { src: src(x.file), alt: x.label || '', loading: 'lazy' }),
          el('figcaption', { className: 'label', textContent: x.label || '—' }))))));
  }

  const preview = el('figure', { className: 'd-preview', style: 'margin:0' });
  const shot = e.shots?.hero || e.shots?.full;
  if (shot) {
    preview.append(
      el('a', { href: src(e.shots?.full || shot), target: '_blank', rel: 'noreferrer noopener',
        title: 'open the full page shot' },
        el('img', { src: src(shot), alt: `${e.title} — first screen`, loading: 'lazy' })),
      el('figcaption', { className: 'label', textContent: 'evidence · click for the full page' }));
  }

  const right = el('div', { className: 'd-apparatus' });
  const dl = el('dl', { className: 'plate-dl label' });
  const rows = [
    e.url ? ['url', el('a', { href: e.url, target: '_blank', rel: 'noreferrer noopener', textContent: host(e.url) })] : ['source', e.source || '—'],
    ['added', e.added ?? '—'], ['kind', e.kind ?? 'site'],
    ['rating', `${e.rating} of 3`], ['review', e.dialectStatus],
    ['dialects', (e.dialects || []).join(', ') || '—'],
  ];
  rows.forEach(([k, v]) => dl.append(el('dt', { textContent: k }), el('dd', {}, v)));
  right.append(dl);

  for (const [cat, list] of Object.entries(e.tags)) {
    if (!list?.length) continue;
    right.append(el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: cat }),
      el('div', { className: 'tagset' }, ...list.map(t => el('span', { className: 'tag', textContent: t })))));
  }
  if (e.unsorted?.length) {
    right.append(el('section', { className: 'judgement' },
      el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: 'unsorted' }),
      el('div', { className: 'tagset' }, ...e.unsorted.map(t => el('span', { className: 'tag', textContent: t })))));
  }

  /* Review controls — same fields production edits. They mutate a local working
     copy and export the file; the token path is not duplicated in a test route. */
  const review = el('section', { className: 'judgement review' });
  review.append(el('h4', { className: 'label', style: 'color:var(--ink-50)', textContent: 'review — local working copy' }));
  const rating = el('select', { ariaLabel: 'rating' });
  [1, 2, 3].forEach(r => rating.append(el('option', { value: String(r), textContent: `rating ${r}`, selected: e.rating === r })));
  const status = el('select', { ariaLabel: 'dialect status' });
  (vocab.dialectStatus ?? []).forEach(s => status.append(el('option', { value: s, textContent: s, selected: e.dialectStatus === s })));
  const dirty = el('p', { className: 'label', style: 'color:var(--ink-50)', textContent: 'unchanged' });
  rating.onchange = () => { e.rating = Number(rating.value); dirty.textContent = 'changed locally — export to keep it'; render(); };
  status.onchange = () => { e.dialectStatus = status.value; dirty.textContent = 'changed locally — export to keep it'; render(); renderPlate(); };
  const exportBtn = el('button', { className: 'btn label', type: 'button', textContent: 'export sites.json' });
  exportBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(entries, null, 2) + '\n'], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'sites.json' }); a.click(); URL.revokeObjectURL(a.href);
  };
  review.append(rating, status, exportBtn, dirty,
    el('p', { className: 'label', style: 'color:var(--ink-50)', textContent: 'saving to github stays in the production vault' }));
  right.append(review);

  body.replaceChildren(el('div', { className: 'detail-grid' }, left, preview, film, right));
  $('#detail').showModal();
}
$('#detail-close').onclick = () => $('#detail').close();

boot().catch(err => { $('#count').textContent = 'could not read ../sites.json'; console.error(err); });
</script>
</body>
</html>
